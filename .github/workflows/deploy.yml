name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 매주 월요일 오전 6시(한국 시간)에 국가법령정보센터 원문을 다시 확인해 사이트를 새로 굽는다.
  schedule:
    - cron: '0 21 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다(이미 시작된 배포는 끝까지 둔다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 법제처 Open API 인증키 — Settings → Secrets and variables → Actions에 LAW_OC로 넣으면 새 판례 자동 수집이 켜진다.
      LAW_OC: ${{ secrets.LAW_OC }}
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 우리 조문 187개의 원문이 기준일 뒤 바뀌었는지, 새로 공포된 시행 예정 개정이 있는지 확인한다.
      # 국가법령정보센터에 접속하지 못해도 지난 결과로 배포는 계속한다.
      - name: 법령 원문 자동 확인
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/law-watch.mjs

      # 인증키가 있을 때만: 기준일 뒤 선고된 대법원 판례 중 우리 조문을 참조조문으로 든 것을 원문 그대로 더한다.
      - name: 새 판례 자동 확인
        if: ${{ env.LAW_OC != '' }}
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/precedent-watch.mjs

      # 계산기 검산 36건과 근거 조문 인용 연결을 먼저 확인한다. 틀리면 배포하지 않는다.
      - name: 데이터·산식 검사
        run: pnpm check

      - name: 빌드
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: pnpm build

      # Pages 활성화는 저장소 소유자만 할 수 있어 워크플로 토큰으로는 켤 수 없다.
      # Settings → Pages → Source를 "GitHub Actions"로 한 번 바꿔 두면 이후로는 자동이다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
